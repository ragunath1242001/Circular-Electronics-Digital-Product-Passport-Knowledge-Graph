name: Backend CI

on:
  push:
    paths: ["backend/**", "ontology/**", "data/**", "mappings/**", "sparql/**", "scripts/**", "tests/semantic/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "ontology/**", "data/**", "mappings/**", "sparql/**", "scripts/**", "tests/semantic/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . ../scripts ../tests/semantic
      - run: mypy app ../scripts ../tests/semantic
      - run: pytest
      - run: python -m pytest tests/semantic
        working-directory: .
